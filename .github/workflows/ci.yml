name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (the rules also as Vibe Pulse checks them: no DOM, no Node)
        run: npm run typecheck
      # Includes the content schemas (tools/content.test.ts), the 64 KB save test and the hidden-info test.
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
